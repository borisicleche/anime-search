[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "F",   # pyflakes + pycodestyle (basics)
  "I",        # import sorting
  "UP",       # modern syntax for py3.13
  "B",        # bugbear: common bugs
  "SIM",      # simplifications
]

[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Report lint issues" }
"lint:fix" = { cmd = "ruff check --fix .", help = "Auto-fix lint issues Ruff can fix" }
format = { cmd = "ruff format .", help = "Format code" }
"format:check" = { cmd = "ruff format --check .", help = "Check formatting without changes (CI)" }
dev = { cmd = "uvicorn app.main:app --reload --port 8080", help = "Run dev server with auto-reload" }
start = { cmd = "uvicorn app.main:app --host 0.0.0.0 --port 8080", help = "Run server (no reload)" }
check = { sequence = ["lint", "format:check"], help = "lint + format:check (CI)" }
test = { cmd = "pytest", help = "Run tests" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
